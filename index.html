<p style="margin:0 0 12px;"><strong>关于</strong></p>
<p style="margin:0;">
这个念头，起于一句很朴素的话——<strong>有些事，做了就回不去了。</strong><br><br>
我们见过太多不可逆的伤害：一刀下去，千年的痕迹就没了；一次误判，人的处境就再难回头。<br><br>
所以「善之经纬」想做的，不是让机器更聪明，而是让机器<strong>先学会舍不得</strong>。<br><br>
我们为不可逆的事留出停顿，为每一个动作留下可追溯的记录，把最终的决定权，交还给人。
